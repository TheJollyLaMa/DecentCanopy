name: Publish Canopy Site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Publish Decent Creator, In-App Rewards, Community Pinning Rewards, Pin Canopy Data to IPFS]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: canopy-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Stage public website only
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets styles scripts data _site/
          cp contributor-accounts.json payroll-assets.json payroll-queue.json community-rewards.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
