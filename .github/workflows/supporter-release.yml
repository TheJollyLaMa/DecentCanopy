name: Prepare Supporter DNFT
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to prepare
        required: true
permissions:
  contents: write
  issues: write
concurrency:
  group: supporter-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    uses: TheJollyLaMa/DecentHead/.github/workflows/product-supporter-prepare.yml@599241344849af1921f6a9a59431f4b2f300d417
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      head_ref: 599241344849af1921f6a9a59431f4b2f300d417
      product_name: DecentCanopy
      tagline: A living map of connected work
      site_root: '.'
      preview_query: '?canopy=agency'
      quantity: '1000'
      price_usdc: '10000000'
      ens_name: ${{ vars.SUPPORTER_ENS_NAME }}
    secrets:
      PINATA_JWT: ${{ secrets.PINATA_JWT }}
