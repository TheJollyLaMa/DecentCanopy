name: Community Pinning Rewards

on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: >
      github.repository == 'TheJollyLaMa/DecentCanopy'
    runs-on: ubuntu-latest
    concurrency:
      group: decent-canopy-payroll-queue
      cancel-in-progress: false
    steps:
      - name: Checkout main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

      - name: Process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/checkCommunityPinners.js

      - name: Validate updated queue
        run: node scripts/validatePayrollQueue.js

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/community-pinners.json payroll-queue.json contributor-accounts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: queue weekly community pinning rewards"
          git pull --rebase origin main
          git push origin HEAD:main
