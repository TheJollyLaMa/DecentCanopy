name: In-App Rewards

# Signed reward requests from the DecentCanopy app arrive here from the relay
# (relay/server.js) as repository_dispatch events. The signature is re-verified below.
on:
  repository_dispatch:
    types: [pinner-request, reward-review]

permissions:
  contents: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    concurrency:
      group: decent-canopy-payroll-queue
      cancel-in-progress: false
    steps:
      - name: Checkout main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

      - name: Install signature verifier
        run: npm ci --prefix relay --omit=dev

      - name: Process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_PATH: relay/node_modules
        run: node scripts/processInAppRequest.js

      - name: Validate updated queue
        run: node scripts/validatePayrollQueue.js

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/community-requests.json data/community-creators.json data/community-pinners.json payroll-queue.json contributor-accounts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record in-app ${{ github.event.action }} request"
          git pull --rebase origin main
          git push origin HEAD:main
