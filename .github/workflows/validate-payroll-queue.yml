name: Validate Payroll Queue

on:
  push:
    branches: [main]
    paths:
      - payroll-queue.json
      - contributor-accounts.json
      - payroll-assets.json
      - community-rewards.json
      - data/community-creators.json
      - data/community-pinners.json
      - data/community-requests.json
      - scripts/**
      - index.html
      - styles/decent-head.css
      - styles/spiral.css
      - data/repository-activity.json
      - test/repository-activity.test.js
      - relay/**
      - test/in-app-rewards.test.js
      - test/decent-creators.test.js
      - test/creator-publishing-ui.test.js
      - test/router-admin.test.js
      - test/decent-funds.test.js
      - data/decent-creators.json
      - data/artizen-archive.json
      - data/agency-map.json
      - data/supporter-dnfts.json
      - test/supporter-dnfts.test.js
      - styles/supporter-dnfts.css
      - test/agency-map.test.js
      - test/agency-release-map.test.js
      - test/canopy-ipfs.test.mjs
      - test/github-repositories.test.js
      - test/share-view.test.js
      - test/payroll.test.js
      - test/commentArt.test.js
      - test/community-rewards.test.js
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths:
      - payroll-queue.json
      - contributor-accounts.json
      - payroll-assets.json
      - community-rewards.json
      - data/community-creators.json
      - data/community-pinners.json
      - data/community-requests.json
      - scripts/**
      - index.html
      - styles/decent-head.css
      - styles/spiral.css
      - data/repository-activity.json
      - test/repository-activity.test.js
      - relay/**
      - test/in-app-rewards.test.js
      - test/decent-creators.test.js
      - test/creator-publishing-ui.test.js
      - test/router-admin.test.js
      - test/decent-funds.test.js
      - data/decent-creators.json
      - data/artizen-archive.json
      - data/agency-map.json
      - data/supporter-dnfts.json
      - test/supporter-dnfts.test.js
      - styles/supporter-dnfts.css
      - test/agency-map.test.js
      - test/agency-release-map.test.js
      - test/canopy-ipfs.test.mjs
      - test/github-repositories.test.js
      - test/share-view.test.js
      - test/payroll.test.js
      - test/commentArt.test.js
      - test/community-rewards.test.js
      - .github/workflows/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    concurrency:
      group: decent-canopy-payroll-validation-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout requested revision
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Validate payroll queue
        run: node scripts/validatePayrollQueue.js

      - name: Install relay dependencies
        run: npm ci --prefix relay --omit=dev

      - name: Test payroll automation
        run: node --test test/repository-activity.test.js test/supporter-dnfts.test.js test/payroll.test.js test/commentArt.test.js test/community-rewards.test.js test/in-app-rewards.test.js test/decent-creators.test.js test/creator-publishing-ui.test.js test/decent-funds.test.js test/router-admin.test.js test/artizen-adapter.test.js test/participation.test.js test/ipfs-backup.test.js test/canopy-ipfs.test.mjs test/agency-map.test.js test/agency-release-map.test.js test/github-repositories.test.js test/share-view.test.js