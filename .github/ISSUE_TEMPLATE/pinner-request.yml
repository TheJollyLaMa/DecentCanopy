name: Become a community pinner
description: Keep canopy data available and qualify for weekly USDC rewards
title: "Pinner request: "
labels: ["pinner-request"]
body:
  - type: markdown
    attributes:
      value: |
        Help keep the canopy decentralized 📌 Pin the latest DecentCanopy backup CID (shown in the site's **IPFS** badge) on your own IPFS node or pinning account and serve it from **your own** gateway.

        After maintainer approval, a weekly matching-byte gateway check qualifies for $0.10 USDC, capped at 20 pinners per week. This verifies availability, not exclusive storage. Queued rewards are not payments; settlement depends on available USDC funding.

        Set up your gateway to serve only content you have pinned (for example, a Pinata dedicated gateway, or Kubo with `Gateway.NoFetch = true`). **Never paste API keys or JWTs here.**

  - type: input
    id: wallet
    attributes:
      label: Base wallet for USDC rewards
      placeholder: 0x...
    validations:
      required: true

  - type: input
    id: gateway
    attributes:
      label: Gateway URL
      description: Public HTTPS gateway root; we request <gateway>/ipfs/<cid>
      placeholder: https://your-gateway.mypinata.cloud
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: Pinning setup
      options:
        - Pinata
        - Kubo node
        - IPFS Desktop
        - Filebase
        - Other pinning service
    validations:
      required: true

  - type: checkboxes
    id: commitment
    attributes:
      label: Pinning commitment
      options:
        - label: I will keep the latest canopy CID pinned and understand that a gateway check shows availability, not proof of storage.
          required: true
